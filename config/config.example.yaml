monitor:
  markets:
    - mainland
    - hong_kong
  report_types:
    - annual
    - first_quarter
    - interim
    - third_quarter
    - quarterly
  state_path: "../data/state.json"
  cache_path: "../data/announcements.db"
  request_timeout: 60
  initial_lookback_hours: 48
  overlap_seconds: 300
  heartbeat_hour: 21
  minimum_market_cap_yi:
    mainland: 100
    hong_kong: 500
  bootstrap_silently: true
  notify_when_no_updates: true

notifications:
  workwechat:
    enabled: false
    env_file: "../.env"
    corp_id_env: "WORKWECHAT_CORP_ID"
    corp_secret_env: "WORKWECHAT_CORP_SECRET"
    agent_id_env: "WORKWECHAT_AGENT_ID"
    user_ids: []
    department_ids: []
    tag_ids: []
